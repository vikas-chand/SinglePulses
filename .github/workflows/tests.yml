name: tests
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install light tier + the handbook engine
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy astropy matplotlib pytest
          pip install --no-deps "git+https://github.com/vikas-chand/GRB-Handbook.git@main#egg=grb-pipeline" || true
      # WHAT THIS CI CAN AND CANNOT CHECK (2026-08-13)
      # results/ is gitignored, so the runner has NO fit tables: every
      # parametrized lesson test would parametrize over an empty list and
      # report green while checking nothing. tests/test_lessons.py
      # ::test_guarded_tables_are_present is the deliberate alarm for that and
      # is EXPECTED TO FAIL here -- a red CI on that test means "unverified in
      # this environment", not "the science is broken".
      # What CI genuinely guards: the tracked catalogs
      # (results/background_intervals.ecsv joined against
      #  results/human_review_qc_flags.txt) and every import/collection error.
      - name: Run the test suite
        run: pytest tests/ -q
