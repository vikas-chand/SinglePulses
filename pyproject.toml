[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "two_breaks"
version = "0.1.0"
description = "Time-resolved spectral analysis of single-pulse Fermi/GBM GRBs: thermal versus two-break origins of the spectral curvature."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Khushboo Sharma"},
    {name = "Vikas Chand", email = "vikas.chand.physics@gmail.com"},
]
dependencies = ["numpy", "scipy", "astropy"]

[project.optional-dependencies]
figures = ["matplotlib"]
docs = ["sphinx", "furo", "myst-parser", "nbsphinx"]
# fitting = 3ML + astromodels + fermitools, installed via conda (see docs/installation)

[tool.setuptools.packages.find]
include = ["two_breaks*"]
