<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" role="img" aria-label="GRBs Agent">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b7a8c"/><stop offset=".55" stop-color="#b07714"/><stop offset="1" stop-color="#b23a6b"/>
    </linearGradient>
  </defs>
  <!-- single-pulse light curve -->
  <polyline points="20,110 60,108 90,104 110,90 125,55 138,30 150,22 162,34 180,62 205,84 240,98 290,105 350,108 420,110"
            fill="none" stroke="url(#pulse)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- gate ticks under the pulse: the rail -->
  <g stroke="#6b7280" stroke-width="3" opacity=".85">
    <line x1="110" y1="122" x2="110" y2="132"/><line x1="150" y1="122" x2="150" y2="132"/>
    <line x1="205" y1="122" x2="205" y2="132"/><line x1="290" y1="122" x2="290" y2="132"/>
  </g>
  <text x="440" y="78" font-family="Palatino, Georgia, serif" font-size="56" fill="#1b7a8c">GRBs</text>
  <text x="440" y="120" font-family="Palatino, Georgia, serif" font-size="40" fill="#6b7280">Agent</text>
</svg>
